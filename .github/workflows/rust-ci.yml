name: Rust CI

on:
  push:
    branches: ["main", "fix/**", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.120
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Vercel entrypoint formatting
        run: rustfmt --edition 2021 --check api/index.rs

      - name: Compile
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets

      - name: Release build
        run: cargo build --locked --release

      - name: Upload resolved Cargo lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error

  dependency-audit:
    name: Rust dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.120

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit --deny warnings

  oauth-security-integration:
    name: OAuth/OIDC security regression tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.120

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration test dependencies
        run: python -m pip install --disable-pip-version-check requests cryptography

      - name: Build release server
        run: cargo build --locked --release

      - name: Start isolated test server
        env:
          KAGI_BIND: 127.0.0.1:8080
          KAGI_ISSUER: http://localhost:8080
          KAGI_DB: kagi-security-e2e.db
          KAGI_SEED_DEMO: "1"
          KAGI_ADMIN_TOKEN: test-admin
        run: |
          ./target/release/kagi > /tmp/kagi-security-test.log 2>&1 &
          echo $! > /tmp/kagi-security-test.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/healthz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/kagi-security-test.pid)" 2>/dev/null; then
              cat /tmp/kagi-security-test.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/kagi-security-test.log
          exit 1

      - name: Run concurrency, DPoP, key rotation and OIDC metadata tests
        env:
          KAGI_BASE: http://localhost:8080
          KAGI_DB: kagi-security-e2e.db
          KAGI_ADMIN_TOKEN: test-admin
        run: python scripts/e2e_security_races.py

      - name: Verify shared rate limiting
        env:
          KAGI_BASE: http://localhost:8080
        run: python scripts/e2e_rate_limit.py

      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/kagi-security-test.log

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/kagi-security-test.pid ]; then
            kill "$(cat /tmp/kagi-security-test.pid)" 2>/dev/null || true
          fi

  oidc-complete-integration:
    name: OIDC core, client management, device flow and logout tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.120

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration test dependencies
        run: python -m pip install --disable-pip-version-check requests cryptography

      - name: Build release server
        run: cargo build --locked --release

      - name: Run OIDC, admin, and complete feature suites
        env:
          KAGI_BIND: 127.0.0.1:8080
          KAGI_ISSUER: http://localhost:8080
          KAGI_SEED_DEMO: "1"
          KAGI_ADMIN_TOKEN: test-admin
          KAGI_REGISTRATION_TOKEN: reg-secret
          KAGI_DEVICE_INTERVAL: "1"
        run: |
          set -euo pipefail

          run_suite() {
            local db="$1"
            shift
            rm -f "$db" "$db-shm" "$db-wal"
            KAGI_DB="$db" ./target/release/kagi > "/tmp/$db.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 60); do
              if curl --fail --silent http://localhost:8080/healthz >/dev/null; then
                break
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "/tmp/$db.log"
                exit 1
              fi
              sleep 1
            done
            KAGI_DB="$db" "$@"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -f "$db" "$db-shm" "$db-wal"
          }

          run_suite kagi-oidc-e2e.db python scripts/e2e_oidc.py
          run_suite kagi-admin-e2e.db python scripts/e2e_admin.py
          run_suite kagi-complete-e2e.db python scripts/e2e_complete_oidc.py

      - name: Show server logs on failure
        if: failure()
        run: |
          for log in /tmp/kagi-*-e2e.db.log; do
            [ -f "$log" ] && { echo "===== $log"; cat "$log"; }
          done

  vercel-security-smoke:
    name: Vercel production security guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Vercel runtime and security configuration
        run: python3 scripts/check_vercel_security.py

  documentation-site-smoke:
    name: Documentation site structure and links
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate documentation site
        run: python3 scripts/check_docs_site.py

  rp-demo-smoke:
    name: RP demo structure and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate RP demo
        run: python3 scripts/check_rp_demo.py

  container-smoke:
    name: Docker Compose quickstart smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Validate hardened production Compose template
        run: |
          cat > "$RUNNER_TEMP/kagi-production.env" <<'EOF'
          KAGI_DOMAIN=identity.example.test
          ACME_EMAIL=ops@example.test
          KAGI_ISSUER=https://identity.example.test
          KAGI_ORIGIN=https://identity.example.test
          KAGI_RP_ID=identity.example.test
          KAGI_RP_NAME=CI Test Identity
          KAGI_DATABASE_URL=postgresql://kagi:ci-only@db.example.test:5432/kagi?sslmode=require
          KAGI_AUTO_MIGRATE=0
          KAGI_ENV=production
          KAGI_COOKIE_SECURE=1
          KAGI_HSTS=1
          KAGI_SEED_DEMO=0
          KAGI_ALLOW_SIGNUP=0
          KAGI_REQUIRE_PAR=1
          KAGI_REQUIRE_DPOP=1
          KAGI_TRUST_PROXY=1
          KAGI_RATE_LIMIT=1
          KAGI_CORS_ORIGINS=https://app.example.test
          KAGI_ADMIN_TOKEN=ci-only-admin-secret-that-is-long-enough
          KAGI_REGISTRATION_TOKEN=ci-only-registration-secret-that-is-long-enough
          EOF
          cp "$RUNNER_TEMP/kagi-production.env" .env.production
          trap 'rm -f .env.production' EXIT
          docker compose --env-file .env.production -f compose.production.yaml config --quiet

      - name: Build and start local stack
        run: docker compose -f compose.yaml up --build -d

      - name: Check discovery and demo endpoints
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/.well-known/openid-configuration >/tmp/discovery.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/discovery.json
          grep -q '"issuer":"http://localhost:8080"' /tmp/discovery.json
          curl --fail --silent http://localhost:8080/jwks.json >/dev/null
          curl --fail --silent http://localhost:8080/demo >/dev/null

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color

      - name: Stop stack and remove isolated test volume
        if: always()
        run: docker compose -f compose.yaml down --volumes
