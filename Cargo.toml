[package]
name = "kagi"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Kagi Identity — a passkey-first OAuth 2.0 and OpenID Connect identity provider"
license = "MIT"
repository = "https://github.com/akiy2009/kagi"
homepage = "https://github.com/akiy2009/kagi"
readme = "README.md"
keywords = ["oidc", "oauth2", "webauthn", "passkey", "identity"]
categories = ["authentication"]

[dependencies]
axum = { version = "0.8", features = ["form", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
base64 = "0.23"
sha2 = { version = "0.11", features = ["oid"] }
p256 = { version = "0.14", features = ["ecdsa"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
getrandom = "0.4"
subtle = "2"
ring = "0.17.14"
anyhow = "1"
tower = "0.5"
vercel_runtime = { version = "2.4", features = ["axum"] }
# Outbound OIDC back-channel logout delivery. rustls-based, no OpenSSL.
ureq = { version = "2", default-features = false, features = ["tls"] }

[[bin]]
name = "main"
path = "api/index.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
